name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches production: Dockerfile builds FROM node:22-slim, which
          # floats to the latest 22.x patch. node:sqlite requires >=22.13.0
          # (flag dropped there, see package.json "engines") — pinning the
          # exact string "22.5" here previously resolved to literal v22.5.0,
          # which predates that and broke CI while production stayed fine.
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:engine
      - run: npm test
      - run: npm run test:engine-config
      - run: npm run test:engine-store
      - run: npm run test:engine-api
      - run: npm run test:engine-rpc
      - run: npm run test:engine-paper
      - run: npm run test:engine-loop
      - run: npm run test:frontend
      - run: npm run scan:real1
